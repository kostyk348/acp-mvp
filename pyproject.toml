[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "acp-mvp"
version = "0.1.0"
description = "Agent Contract Protocol MVP — decentralized agent network with EML contracts"
requires-python = ">=3.11"
dependencies = [
    "aiosmtpd>=1.0.0",
    "docker>=7.0.0",
    "web3>=6.0.0",
    "eth-account>=0.10.0",
    "cryptography>=41.0.0",
    "jsonschema>=4.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
acp = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["eml", "transport", "sandbox", "identity", "settlement", "sint_ua", "orchestrator"]
